[SERVICE]
    Flush 5
    Log_Level warn
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /buffers
    storage.backlog.mem_limit 8M
[INPUT]
    Name tail
    Path /var/log/containers/*_ray-assignment_ray-head-*.log,/var/log/containers/*_ray-assignment_ray-worker-*.log,/var/log/containers/*_ray-assignment_ray-job-submitter-*.log
    Tag ray.*
    multiline.parser cri
    DB /buffers/tail.db
    Read_from_Head On
    Refresh_Interval 5
    Mem_Buf_Limit 8MB
    Skip_Long_Lines On
    storage.type filesystem
[OUTPUT]
    Name cloudwatch_logs
    Match ray.*
    region {{ .Values.logging.region }}
    log_group_name {{ .Values.logging.logGroup }}
    log_stream_prefix ray-
    auto_create_group Off
    Retry_Limit 3
    storage.total_limit_size 32M
