name: Build image and deploy RayJob
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assignment-deployment
  cancel-in-progress: false
jobs:
  release:
    concurrency:
      group: assignment-aws-jobs
      cancel-in-progress: false
    if: vars.CICD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CI_BUCKET: ${{ vars.AWS_CI_BUCKET }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CODEBUILD_PROJECT: ${{ vars.AWS_DEPLOY_PROJECT }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]' PyYAML==6.0.3
      - run: pytest -q
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Enforce budget and existing lease before building
        run: |
          PYTHONPATH=scripts python3 -c 'from ci_common import load_config,check_budget; check_budget(load_config())'
          registry="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: image
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=min
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy by digest through the private API
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/ci-trigger.py deploy --image "$ECR_REPOSITORY_URI@$IMAGE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rayjob-result
          path: runtime/deploy-result.json
          retention-days: 1
          if-no-files-found: ignore
