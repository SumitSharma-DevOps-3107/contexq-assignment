name: Terraform plans and tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plans-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: pip install -e '.[test]' PyYAML==6.0.3
      - run: pytest -q
      - run: terraform fmt -check -recursive infra
      - name: Validate all Terraform layers without AWS credentials
        run: |
          for layer in bootstrap data compute ci platform; do
            terraform -chdir="infra/$layer" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$layer" validate
          done
  cloud-plan:
    needs: validate
    if: >-
      vars.CICD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    env:
      CI_BUCKET: ${{ vars.AWS_CI_BUCKET }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CODEBUILD_PROJECT: ${{ vars.AWS_PLAN_PROJECT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-session-name: gha-plan-${{ github.run_id }}
      - name: Plan privately with a read-only role
        run: python3 scripts/ci-trigger.py plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: terraform-plan-summary
          path: runtime/plan-result.json
          retention-days: 1
          if-no-files-found: ignore
